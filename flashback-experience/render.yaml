services:
  - type: web
    name: flashback-experience
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FLASHBACK_PASSWORD
        sync: false        # set in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
